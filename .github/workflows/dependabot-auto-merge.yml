name: Dependabot auto-merge

# pull_request_target: Dependabot-triggered pull_request runs get a read-only
# GITHUB_TOKEN and no secrets, so auto-merge would 403. This workflow never
# checks out or executes PR code, so the privileged context is safe.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'NurettinSelim/radyoozu-rework'
    runs-on: ubuntu-latest
    steps:
      # DEPENDABOT_ALERTS_PAT: fine-grained PAT, this repo only, permission
      # "Dependabot alerts: read". Needed for alert-lookup (ghsa-id/cvss);
      # GITHUB_TOKEN cannot read Dependabot alerts. Without the secret the
      # CVSS branch below is inert and only patch/minor auto-merge.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          alert-lookup: ${{ secrets.DEPENDABOT_ALERTS_PAT != '' }}
          github-token: ${{ secrets.DEPENDABOT_ALERTS_PAT || secrets.GITHUB_TOKEN }}
      # Fail closed: explicit patch/minor allowlist (empty or unknown
      # update-type never merges), plus majors only for a critical
      # (CVSS >= 9) security advisory.
      - name: Enable auto-merge (patch/minor, or critical security fix)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          (steps.metadata.outputs.ghsa-id != '' && steps.metadata.outputs.cvss >= 9)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
